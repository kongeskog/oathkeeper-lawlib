name: External source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lawlib
      - id: pin
        shell: pwsh
        run: |
          $pin = Get-Content -Raw lawlib/compatibility.json | ConvertFrom-Json
          "revision=$($pin.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.OATHKEEPER_REPOSITORY }}
          ref: ${{ steps.pin.outputs.revision }}
          path: oathkeeper
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - working-directory: oathkeeper
        run: cargo build --workspace --locked
      - shell: pwsh
        run: |
          $packages = Get-Content -Raw lawlib/packages.json | ConvertFrom-Json
          foreach ($package in $packages) {
            & ./oathkeeper/target/debug/oath sources check "lawlib/$package" --fetch --cache source-cache
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
